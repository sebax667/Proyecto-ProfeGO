name: Deploy ProfeGo Production

on:
  workflow_run:
    workflows: ["ProfeGo CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profego-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' < deploy/remote_deploy.sh

      - name: Smoke test production URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail

          check_blocked_path() {
            local path="$1"
            local status
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$APP_URL$path")
            case "$status" in
              403|404) echo "Protected path $path -> HTTP $status" ;;
              *) echo "Unexpected HTTP $status for protected path $path" >&2; exit 1 ;;
            esac
          }

          catalog_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$APP_URL/catalog")
          if [ "$catalog_status" != "200" ]; then
            echo "Unexpected HTTP $catalog_status for /catalog" >&2
            exit 1
          fi
          check_blocked_path '/.env'
          check_blocked_path '/database/database.sqlite'
          check_blocked_path '/.git/config'
          check_blocked_path '/vendor/autoload.php'
          headers=$(curl --silent --show-error --dump-header - --output /dev/null --max-time 15 "$APP_URL/catalog" | tr -d '\r')
          for header in Strict-Transport-Security X-Content-Type-Options X-Frame-Options Content-Security-Policy; do
            if ! printf '%s\n' "$headers" | grep -qi "$header"; then
              echo "Missing security header $header on /catalog" >&2
              exit 1
            fi
          done

      - name: Deployment summary
        run: |
          echo "Public URL: ${{ vars.APP_URL }}" >> "$GITHUB_STEP_SUMMARY"
