name: Deploy ProfeGo Production

on:
  workflow_run:
    workflows: ["ProfeGo CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profego-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH host verification
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]]
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ -n "$VPS_SSH_KEY" && -n "$VPS_KNOWN_HOSTS" ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
          awk -v host="$VPS_HOST" '
            $1 !~ /^#/ {
              count = split($1, hosts, ",")
              for (i = 1; i <= count; i++) {
                if (hosts[i] == host && $2 == "ssh-ed25519") found = 1
              }
            }
            END { exit !found }
          ' "$HOME/.ssh/known_hosts"

      - name: Deploy exact CI commit
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_URL" =~ ^https://([A-Za-z0-9][A-Za-z0-9.-]*)$ ]]
          health_host="${BASH_REMATCH[1]}"
          remote_output="$(ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -- \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_COMMIT=$DEPLOY_COMMIT HEALTHCHECK_HOST=$health_host bash -s" \
            < scripts/deploy/remote_deploy.sh)"
          printf '%s\n' "$remote_output"
          previous_commit=$(printf '%s\n' "$remote_output" | sed -n 's/^PREVIOUS_COMMIT=//p' | tail -n 1)
          [[ "$previous_commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'previous_commit=%s\n' "$previous_commit" >> "$GITHUB_OUTPUT"

      - name: Public smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          [[ "$APP_URL" =~ ^https://([A-Za-z0-9][A-Za-z0-9.-]*)$ ]]

          check_blocked_path() {
            local path="$1"
            local status
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$APP_URL$path")
            case "$status" in
              403|404) echo "Protected path $path -> HTTP $status" ;;
              *) echo "Unexpected HTTP $status for protected path $path" >&2; exit 1 ;;
            esac
          }

          catalog_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$APP_URL/catalog")
          if [ "$catalog_status" != "200" ]; then
            echo "Unexpected HTTP $catalog_status for /catalog" >&2
            exit 1
          fi
          check_blocked_path '/.env'
          check_blocked_path '/database/database.sqlite'
          check_blocked_path '/.git/config'
          check_blocked_path '/vendor/autoload.php'
          headers=$(curl --silent --show-error --dump-header - --output /dev/null --max-time 15 "$APP_URL/catalog" | tr -d '\r')
          for header in Strict-Transport-Security X-Content-Type-Options X-Frame-Options Content-Security-Policy; do
            if ! printf '%s\n' "$headers" | grep -qi "$header"; then
              echo "Missing security header $header on /catalog" >&2
              exit 1
            fi
          done

      - name: Roll back failed public smoke test
        if: ${{ failure() && steps.deploy.outputs.previous_commit != '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ROLLBACK_COMMIT: ${{ steps.deploy.outputs.previous_commit }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          [[ "$ROLLBACK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$APP_URL" =~ ^https://([A-Za-z0-9][A-Za-z0-9.-]*)$ ]]
          health_host="${BASH_REMATCH[1]}"
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -- \
            "$VPS_USER@$VPS_HOST" \
            "ROLLBACK_COMMIT=$ROLLBACK_COMMIT HEALTHCHECK_HOST=$health_host bash -s" \
            < scripts/deploy/rollback.sh

      - name: Deployment summary
        run: |
          echo "Public URL: ${{ vars.APP_URL }}" >> "$GITHUB_STEP_SUMMARY"
