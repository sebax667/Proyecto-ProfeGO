name: ProfeGo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite, curl, mbstring
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find app public resources tests database -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Validate deployment scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/smoke_test.sh
          bash -n deploy/setup_production.sh

      - name: Run integration test
        run: php tests/booking_integration.php

      - name: Run AI integration test
        run: php tests/ai_integration.php
