name: ProfeGo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: sqlite3, pdo_sqlite, mbstring
          coverage: none

      - name: Validate PHP Syntax
        run: |
          find app public resources tests database -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Validate Shell Scripts Syntax
        run: |
          bash -n deploy/*.sh

      - name: Install Dependencies
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: Prepare Database Directory
        run: |
          mkdir -p database
          chmod 750 database

      - name: Run Booking Integration Tests
        run: php tests/booking_integration.php

      - name: Run AI Integration Tests
        run: php tests/ai_integration.php
