name: ProfeGo CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, curl, mbstring
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint PHP files
        run: |
          find app public resources tests database -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          for script in deploy/*.sh; do bash -n "$script"; done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind assets
        run: npm run build:css

      - name: Run test suite
        run: |
          set -euo pipefail
          for file in tests/*.php; do php "$file"; done

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --no-banner --redact --report-format sarif --report-path results.sarif
